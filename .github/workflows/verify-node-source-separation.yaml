name: Verify Node.js source separation

on:
  push:
    branches:
      - verify/node-source-separation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} Node 22 and 16
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '8.15.9'
      - name: Install build and style tools
        run: |
          python -m pip install ninja cpplint==2.0.2
          pnpm --dir scripts/node-addon-api install --ignore-scripts --no-frozen-lockfile
      - name: Build native libraries and all C++ unit tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/install" \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF \
            -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_ONNX_ENABLE_BINARY=OFF \
            -DSHERPA_ONNX_ENABLE_TESTS=ON
          cmake --build build --target install --parallel 2
          ctest --test-dir build --output-on-failure --parallel 1
      - name: Build and test Node 22 addon
        env:
          SHERPA_ONNX_INSTALL_DIR: ${{ github.workspace }}/build/install
        run: |
          pnpm --dir scripts/node-addon-api exec cmake-js compile --parallel 2
          pnpm --dir scripts/node-addon-api run typecheck
          pnpm --dir scripts/node-addon-api test
          python -m cpplint scripts/node-addon-api/src/offline-source-separation.cc harmony-os/SherpaOnnxHar/sherpa_onnx/src/main/cpp/sherpa-onnx-node-addon-api.cc
          bash .github/scripts/verify-node-source-separation.sh
      - uses: actions/setup-node@v4
        if: runner.os != 'macOS'
        with:
          node-version: '16.20.2'
      - name: Install macOS Node 16 with bounded download retries
        if: runner.os == 'macOS'
        run: |
          node16_dir="$RUNNER_TEMP/node-v16.20.2-darwin-arm64"
          curl --ipv4 --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            https://nodejs.org/dist/v16.20.2/node-v16.20.2-darwin-arm64.tar.gz \
            --output "$RUNNER_TEMP/node16.tar.gz"
          tar xzf "$RUNNER_TEMP/node16.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$node16_dir/bin" >> "$GITHUB_PATH"
          printf 'SHERPA_ONNX_NODE16_HEADERS=%s\n' "$node16_dir/include/node" >> "$GITHUB_ENV"
      - name: Rebuild and test Node 16 addon
        env:
          SHERPA_ONNX_INSTALL_DIR: ${{ github.workspace }}/build/install
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            node --version
            cmake -S scripts/node-addon-api -B scripts/node-addon-api/build \
              -DCMAKE_JS_INC="$SHERPA_ONNX_NODE16_HEADERS" -DCMAKE_BUILD_TYPE=Release
            cmake --build scripts/node-addon-api/build --parallel 2
          else
            pnpm --dir scripts/node-addon-api exec cmake-js rebuild --parallel 2
          fi
          pnpm --dir scripts/node-addon-api test
          bash .github/scripts/verify-node-source-separation.sh
